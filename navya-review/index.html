<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astra Kundli interface review</title>
<style>
:root{color-scheme:light;background:#fbf8f3;color:#24294e;font-family:system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0}
header{padding:clamp(38px,7vw,80px) max(20px,calc((100vw - 1150px)/2));background:linear-gradient(144deg,#191b36,#2c2b52);color:#f8f1e3}
header p{max-width:45rem;margin:.65rem 0 0;line-height:1.6}
.brand{color:#edd39d;font-weight:650}
h1{font:normal clamp(34px,6vw,62px)/1.1 Georgia,serif;margin:14px 0 8px}
main{max-width:1190px;margin:auto;padding:30px 20px 70px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
figure{margin:0;border:1px solid #ded8ce;background:#fff;border-radius:18px;overflow:hidden}
.shot{display:block;height:320px;background:#f1ede6;overflow:hidden}
.shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
figcaption{padding:17px}
figcaption h2{font:600 19px/1.25 Georgia,serif;margin:0 0 8px}
figcaption p{line-height:1.55;font-size:14px;margin:0;color:#4b5370}
a:focus-visible{outline:3px solid #8a6b31;outline-offset:-3px}
@media(max-width:860px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){main{grid-template-columns:1fr}.shot{height:360px}}
</style>
</head>
<body>
<header>
<p class="brand">Astra Kundli</p>
<h1>Landing and chart tools</h1>
<p>Static review screenshots from the revised interface. The charts and names shown are fictional. Select any screenshot to view it at full size.</p>
</header>
<main aria-label="Interface screenshots">
<figure><a class="shot" href="./images/home-desktop.png" aria-label="Open Home on desktop screenshot"><img src="./images/home-desktop.png" alt="Home on desktop interface screenshot" loading="lazy"></a><figcaption><h2>Home on desktop</h2><p>Report-led landing and the interactive Kundli handset preview.</p></figcaption></figure>
<figure><a class="shot" href="./images/home-mobile.png" aria-label="Open Home on mobile screenshot"><img src="./images/home-mobile.png" alt="Home on mobile interface screenshot" loading="lazy"></a><figcaption><h2>Home on mobile</h2><p>The same destinations remain visible when you return to Home.</p></figcaption></figure>
<figure><a class="shot" href="./images/account-guest.png" aria-label="Open Sign in or continue as a guest screenshot"><img src="./images/account-guest.png" alt="Sign in or continue as a guest interface screenshot" loading="lazy"></a><figcaption><h2>Sign in or continue as a guest</h2><p>The choice before entering birth details.</p></figcaption></figure>
<figure><a class="shot" href="./images/my-life.png" aria-label="Open My Life screenshot"><img src="./images/my-life.png" alt="My Life interface screenshot" loading="lazy"></a><figcaption><h2>My Life</h2><p>The personal dashboard holds the saved chart, current period and today’s Panchang.</p></figcaption></figure>
<figure><a class="shot" href="./images/kundli.png" aria-label="Open Kundli screenshot"><img src="./images/kundli.png" alt="Kundli interface screenshot" loading="lazy"></a><figcaption><h2>Kundli</h2><p>The selected house explains the actual planet and sign placements. The legend identifies the chart symbols.</p></figcaption></figure>
<figure><a class="shot" href="./images/dasha.png" aria-label="Open Dasha screenshot"><img src="./images/dasha.png" alt="Dasha interface screenshot" loading="lazy"></a><figcaption><h2>Dasha</h2><p>The running period shows the time remaining in calendar years, months and days.</p></figcaption></figure>
<figure><a class="shot" href="./images/panchang.png" aria-label="Open Panchang screenshot"><img src="./images/panchang.png" alt="Panchang interface screenshot" loading="lazy"></a><figcaption><h2>Panchang</h2><p>Sun and Moon views use the chosen date, with a real lunar texture and the calculated phase.</p></figcaption></figure>
<figure><a class="shot" href="./images/moon-phase.png" aria-label="Open Moon phase screenshot"><img src="./images/moon-phase.png" alt="Moon phase interface screenshot" loading="lazy"></a><figcaption><h2>Moon phase</h2><p>The illuminated shape follows the selected chart or calendar moment.</p></figcaption></figure>
<figure><a class="shot" href="./images/hora.png" aria-label="Open Hora screenshot"><img src="./images/hora.png" alt="Hora interface screenshot" loading="lazy"></a><figcaption><h2>Hora</h2><p>Panchang and Hora share the selected date and sunrise boundaries.</p></figcaption></figure>
<figure><a class="shot" href="./images/saturn.png" aria-label="Open Saturn screenshot"><img src="./images/saturn.png" alt="Saturn interface screenshot" loading="lazy"></a><figcaption><h2>Saturn</h2><p>The photograph keeps both ends of the rings in view.</p></figcaption></figure>
<figure><a class="shot" href="./images/sade-sati.png" aria-label="Open Sade Sati screenshot"><img src="./images/sade-sati.png" alt="Sade Sati interface screenshot" loading="lazy"></a><figcaption><h2>Sade Sati</h2><p>Each phase uses the glyph for its calculated zodiac sign.</p></figcaption></figure>
<figure><a class="shot" href="./images/manglik.png" aria-label="Open Manglik screenshot"><img src="./images/manglik.png" alt="Manglik interface screenshot" loading="lazy"></a><figcaption><h2>Manglik</h2><p>The house containing Mars stays highlighted while you inspect another house.</p></figcaption></figure>
</main>
</body>
</html>
